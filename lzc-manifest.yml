application:
  subdomain: claude-proxy
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://claude-proxy-app:3000/

services:
  claude-proxy-app:
    # upstream: ghcr.io/benedictking/claude-proxy:latest@sha256:79dd4ebc0eb16226f55d5bf511cd4575970468f1fdfdc6c3a0088ca4717008d9
    image: registry.lazycat.cloud/czyt/bene/claude-proxy:e6405663e37eb742
    environment:
      - ENV=production
      - ENABLE_WEB_UI=true
      - PROXY_ACCESS_KEY={{.U.proxy_access_key}}
      - LOG_LEVEL={{.U.log_level}}
      - ENABLE_REQUEST_LOGS={{.U.enable_request_logs}}
      - ENABLE_RESPONSE_LOGS={{.U.enable_response_logs}}
    binds:
      - /lzcapp/var/config:/app/.config
      - /lzcapp/var/logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
